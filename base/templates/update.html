{% extends 'main.html' %}

{% block content %}
<div class="form-container update-form-container">

    <div class="update-form-header">
        <div class="update-form-icon">✏️</div>
        <h2>Update Passenger Details</h2>
        <p>Review and update your passenger information below.</p>
    </div>

    <form action="" method="post">
        {% csrf_token %}

        <div class="update-form-group">
            <label for="pname">Passenger Name</label>
            <input type="text" id="pname" name="pname"
                   value="{{ us.pname }}" required>
        </div>

        <div class="update-form-group">
            <label for="ano">Aadhaar Number</label>
            <input type="text" id="ano" name="ano"
                   value="{{ us.ano }}">
        </div>

        <div class="update-form-group">
            <label for="phno">Phone Number</label>
            <input type="text" id="phno" name="phno"
                   value="{{ us.phno }}">
        </div>

        <div class="update-form-group">
            <label for="email">Email Address</label>
            <input type="text" id="email" name="email"
                   value="{{ us.email }}" required>
        </div>

        <button type="submit" class="update-submit-btn">
            Update Details
        </button>
    </form>

</div>
{% endblock content %}
